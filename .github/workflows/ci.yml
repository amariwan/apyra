name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --all-packages --all-extras
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --python ${{ matrix.python-version }} mypy
      - run: uv run --python ${{ matrix.python-version }} pyright
      - run: |
          for package in ai auth cache channels cli core db email events fastapi i18n observability security storage tasks; do
            uv run --python ${{ matrix.python-version }} pyright --verifytypes "apyra.${package}" --ignoreexternal
          done
      - run: uv run --python ${{ matrix.python-version }} pytest

  build:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - run: |
          for package in core fastapi storage db auth cache ai observability email channels i18n events security tasks cli; do
            uv build --package "apyra-${package}"
          done
          uv build --package apyra
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: distributions
          path: dist/*

  install:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: distributions
          path: dist
      - run: python -m venv /tmp/apyra-venv
      - run: /tmp/apyra-venv/bin/pip install dist/*.whl
      - run: |
          /tmp/apyra-venv/bin/python - <<'PY'
          import importlib
          from importlib.resources import files

          modules = (
              "ai", "auth", "cache", "channels", "cli", "core", "db", "email",
              "events", "fastapi", "i18n", "observability", "security", "storage", "tasks",
          )
          for name in modules:
              module = importlib.import_module(f"apyra.{name}")
              if not files(module).joinpath("py.typed").is_file():
                  raise RuntimeError(f"{module.__name__} is missing its PEP 561 marker")
          print("imports and PEP 561 markers ok")
          PY
