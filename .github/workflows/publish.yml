name: publish

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v"
        required: true
        type: string
      publish:
        description: "Publish packages to PyPI (manual runs default to a dry validation build)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    if: github.repository == 'amariwan/apyra'
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }} --all-packages --all-extras
      - run: uv run --python ${{ matrix.python-version }} ruff check .
      - run: uv run --python ${{ matrix.python-version }} ruff format --check .
      - run: uv run --python ${{ matrix.python-version }} mypy
      - run: uv run --python ${{ matrix.python-version }} pyright
      - run: |
          for package in ai auth cache channels cli core db email events fastapi i18n observability security storage tasks; do
            uv run --python ${{ matrix.python-version }} pyright --verifytypes "apyra.${package}" --ignoreexternal
          done
      - run: uv run --python ${{ matrix.python-version }} pytest

  build:
    needs: quality
    if: github.repository == 'amariwan/apyra'
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Determine release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION}"
          fi
          if [ -z "${version}" ]; then
            echo "Could not determine release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Validate release version and metadata
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv run --python 3.12 python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", expected):
              raise SystemExit(f"Invalid release version: {expected!r}")

          manifests = sorted(Path("packages").glob("*/pyproject.toml"))
          if not manifests:
              raise SystemExit("No package manifests found")

          mismatches = []
          for manifest in manifests:
              project = tomllib.loads(manifest.read_text(encoding="utf-8"))["project"]
              if project["version"] != expected:
                  mismatches.append(f"{project['name']}: {project['version']}")

          if mismatches:
              raise SystemExit(
                  f"Release version {expected!r} does not match package versions: "
                  + ", ".join(mismatches)
              )

          meta = tomllib.loads(Path("packages/meta/pyproject.toml").read_text(encoding="utf-8"))
          core_dependency = meta["project"]["dependencies"][0]
          expected_range = (
              f"apyra-core>={expected},<{expected.split('.')[0]}.{int(expected.split('.')[1]) + 1}.0"
          )
          if core_dependency != expected_range:
              raise SystemExit(
                  f"Metapackage core dependency {core_dependency!r} does not match {expected_range!r}"
              )

          print(f"Validated {len(manifests)} distributions at version {expected}")
          PY
      - run: |
          for package in core fastapi storage db auth cache ai observability email channels i18n events security tasks cli; do
            uv build --package "apyra-${package}"
          done
          uv build --package apyra
      - name: Attest build provenance
        uses: actions/attest-build-provenance@c5a222773935d2c5817109c1a4293303cccc3f41 # v1.5.1
        with:
          subject-path: "dist/*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-distributions
          path: dist/*
          if-no-files-found: error

  validate:
    needs: build
    if: github.repository == 'amariwan/apyra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - run: uv python install 3.12
      - run: uv run --no-project --python 3.12 scripts/validate_release.py --dist dist

  publish-core:
    needs: [validate, build]
    if: >-
      github.repository == 'amariwan/apyra' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: pypi-core
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Stage core distribution
        run: |
          mkdir -p publish
          cp dist/apyra_core-* publish/
      - uses: pypa/gh-action-pypi-publish@release/v1  # v1.12.1, SHA 1f5d4ec244f65dce93685ee3e98e77123f090866
        with:
          packages-dir: publish
          attestations: true
          skip-existing: true

  verify-core:
    needs: [publish-core, build]
    if: github.repository == 'amariwan/apyra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Wait for apyra-core on PyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          if [ -z "${version}" ]; then
            echo "Release version is unavailable" >&2
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/apyra-core/${version}/json" >/dev/null; then
              echo "apyra-core ${version} is available on PyPI"
              exit 0
            fi
            echo "Waiting for apyra-core ${version} (attempt ${attempt}/30)"
            sleep 10
          done
          echo "apyra-core ${version} was not found on PyPI" >&2
          exit 1
      - name: Install and import apyra-core from PyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          uv venv /tmp/apyra-core-check
          uv pip install --python /tmp/apyra-core-check/bin/python "apyra-core==${version}"
          /tmp/apyra-core-check/bin/python -c "import apyra.core; print('apyra.core import ok')"

  publish-leaf:
    needs: [verify-core, build]
    if: >-
      github.repository == 'amariwan/apyra' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    strategy:
      fail-fast: false
      matrix:
        package:
          - ai
          - auth
          - cache
          - channels
          - cli
          - db
          - email
          - events
          - i18n
          - observability
          - security
          - storage
          - tasks
    runs-on: ubuntu-latest
    environment: ${{ format('pypi-{0}', matrix.package) }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Stage package distribution
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p publish
          normalized="${PACKAGE//-/_}"
          cp "dist/apyra_${normalized}-"* publish/
      - uses: pypa/gh-action-pypi-publish@release/v1  # v1.12.1, SHA 1f5d4ec244f65dce93685ee3e98e77123f090866
        with:
          packages-dir: publish
          attestations: true
          skip-existing: true

  verify-packages:
    needs: [publish-leaf, build]
    if: github.repository == 'amariwan/apyra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Wait for leaf packages on PyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          if [ -z "${version}" ]; then
            echo "Release version is unavailable" >&2
            exit 1
          fi
          for package in ai auth cache channels cli db email events i18n observability security storage tasks; do
            pypi_name="apyra-${package}"
            available=0
            for attempt in $(seq 1 30); do
              if curl -fsS "https://pypi.org/pypi/${pypi_name}/${version}/json" >/dev/null; then
                available=1
                break
              fi
              echo "Waiting for ${pypi_name} ${version} (attempt ${attempt}/30)"
              sleep 10
            done
            if [ "${available}" != "1" ]; then
              echo "${pypi_name} ${version} was not found on PyPI" >&2
              exit 1
            fi
            echo "${pypi_name} ${version} is available on PyPI"
          done

  publish-fastapi:
    needs: [verify-packages, build]
    if: >-
      github.repository == 'amariwan/apyra' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: pypi-fastapi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Stage FastAPI distribution
        run: |
          mkdir -p publish
          cp dist/apyra_fastapi-* publish/
      - uses: pypa/gh-action-pypi-publish@release/v1  # v1.12.1, SHA 1f5d4ec244f65dce93685ee3e98e77123f090866
        with:
          packages-dir: publish
          attestations: true
          skip-existing: true

  verify-fastapi:
    needs: [publish-fastapi, build]
    if: github.repository == 'amariwan/apyra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Wait for apyra-fastapi on PyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          if [ -z "${version}" ]; then
            echo "Release version is unavailable" >&2
            exit 1
          fi
          for attempt in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/apyra-fastapi/${version}/json" >/dev/null; then
              echo "apyra-fastapi ${version} is available on PyPI"
              exit 0
            fi
            echo "Waiting for apyra-fastapi ${version} (attempt ${attempt}/30)"
            sleep 10
          done
          echo "apyra-fastapi ${version} was not found on PyPI" >&2
          exit 1
      - name: Install and import apyra-fastapi from PyPI
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          uv venv /tmp/apyra-fastapi-check
          uv pip install --python /tmp/apyra-fastapi-check/bin/python "apyra-fastapi==${version}"
          /tmp/apyra-fastapi-check/bin/python -c "import apyra.fastapi; print('apyra.fastapi import ok')"

  publish-meta:
    needs: [verify-fastapi, verify-packages, build]
    if: >-
      github.repository == 'amariwan/apyra' &&
      (github.event_name != 'workflow_dispatch' || inputs.publish == true)
    runs-on: ubuntu-latest
    environment: pypi-meta
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-distributions
          path: dist
      - name: Stage metapackage distribution
        run: |
          mkdir -p publish
          find dist -maxdepth 1 -type f \( -name 'apyra-[0-9]*.whl' -o -name 'apyra-[0-9]*.tar.gz' \) -exec cp {} publish/ \;
          test -n "$(find publish -type f -print -quit)"
      - uses: pypa/gh-action-pypi-publish@release/v1  # v1.12.1, SHA 1f5d4ec244f65dce93685ee3e98e77123f090866
        with:
          packages-dir: publish
          attestations: true
          skip-existing: true

  smoke-test:
    needs: [publish-meta, build]
    if: github.repository == 'amariwan/apyra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
      - name: Determine release version
        id: version
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          version="${RELEASE_VERSION}"
          if [ -z "${version}" ]; then
            if [ "${{ github.ref_type }}" = "tag" ]; then
              version="${{ github.ref_name }}"
              version="${version#v}"
            else
              version="${{ inputs.version }}"
            fi
          fi
          if [ -z "${version}" ]; then
            echo "Could not determine release version" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - name: Install from PyPI and run smoke test
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv venv /tmp/apyra-pypi-smoke
          uv pip install --python /tmp/apyra-pypi-smoke/bin/python "apyra[all]==${RELEASE_VERSION}"
          /tmp/apyra-pypi-smoke/bin/python - <<'PY'
          import importlib

          from fastapi.testclient import TestClient

          from apyra.fastapi import create_app

          app = create_app()
          with TestClient(app) as client:
              response = client.get("/health")
              assert response.status_code == 200
              assert response.json()["status"] == "ok"

          for module_name in ("apyra.core", "apyra.fastapi", "apyra.observability"):
              importlib.import_module(module_name)

          print("PyPI smoke test passed")
          PY
