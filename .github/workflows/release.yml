name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

permissions:
  contents: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: |
          for package in core fastapi storage db auth cache ai observability email channels i18n events security tasks cli; do
            uv build --package "apyra-${package}"
          done
          uv build --package apyra
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: astral-sh/setup-uv@v5
      - run: python -m venv /tmp/verify && /tmp/verify/bin/pip install dist/*.whl
      - run: /tmp/verify/bin/python -c "import apyra.core, apyra.fastapi, apyra.db, apyra.auth, apyra.storage, apyra.cache, apyra.ai, apyra.observability, apyra.email, apyra.channels, apyra.i18n, apyra.events, apyra.security, apyra.tasks, apyra.cli; print('release imports ok')"

  publish:
    runs-on: ubuntu-latest
    needs: verify
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
