requires-python = ">=3.12"
dependencies = [
    "apyra-fastapi>=0.1.0,<0.2.0",
    "apyra-cache>=0.1.0,<0.2.0",
    "uvicorn>=0.30.0",
]

[tool.uv.sources]
apyra-fastapi = { path = "../../packages/fastapi", editable = true }
