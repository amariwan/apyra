[project]
name = "apyra-email"
version = "0.1.0"
description = "Email delivery primitives for Apyra."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "amariwan" }]
dependencies = [
    "apyra-core>=0.1.0,<0.2.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
]

[project.optional-dependencies]
celery = ["celery>=5.5.0"]
providers = ["httpx>=0.27.0", "boto3>=1.34.0"]
sdk = ["sendgrid>=6.0.0", "postmarker>=1.0.0", "sib-api-v3-sdk>=7.0.0", "mailgun>=1.0.0"]

[tool.uv.sources]
apyra-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["apyra.email"]
namespace = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
