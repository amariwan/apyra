[project]
name = "apyra-fastapi"
version = "0.1.0"
description = "FastAPI integration for Apyra."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "amariwan" }]
dependencies = [
    "apyra-core>=0.1.0,<0.2.0",
    "apyra-auth>=0.1.0,<0.2.0",
    "apyra-security>=0.1.0,<0.2.0",
    "apyra-observability>=0.1.0,<0.2.0",
    "fastapi>=0.115.0",
    "starlette",
]

[tool.uv.sources]
apyra-core = { workspace = true }
apyra-auth = { workspace = true }
apyra-security = { workspace = true }
apyra-observability = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["apyra.fastapi"]
namespace = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["B008"]
"tests/**/*.py" = ["B008"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
