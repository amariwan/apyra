[project]
name = "apyra-observability"
version = "0.1.0"
description = "Logging, error, and performance monitoring primitives for Apyra."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "amariwan" }]
dependencies = [
    "apyra-core>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
opentelemetry = [
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
]

[tool.uv.sources]
apyra-core = { workspace = true }

[project.urls]
Homepage = "https://github.com/amariwan/apyra"
Repository = "https://github.com/amariwan/apyra"
Issues = "https://github.com/amariwan/apyra/issues"
Documentation = "https://github.com/amariwan/apyra/tree/main/docs"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["apyra.observability"]
namespace = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
