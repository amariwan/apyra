[project]
name = "apyra-tasks"
version = "0.1.0"
description = "Background task primitives for Apyra."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "amariwan" }]
dependencies = [
    "apyra-core>=0.1.0,<0.2.0",
]

[project.optional-dependencies]
celery = ["celery>=5.5.0"]
taskiq = ["taskiq>=0.11.0"]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["apyra.tasks"]
namespace = true

[tool.uv.sources]
apyra-core = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
